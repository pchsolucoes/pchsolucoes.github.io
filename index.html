<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PCH Soluções</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;

    background:#ffffff;

    color:#2c3e50;

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:100vh;

    padding:20px;

    overflow:hidden;

    position:relative;

}


/* ===========================
   FUNDO COM HARDWARE
   =========================== */


.bg-slideshow {

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    z-index:1;

    filter:blur(2px);

    transform:scale(1.05);

}



.bg-img {

    position:absolute;

    width:100%;
    height:100%;

    background-size:cover;

    background-position:center;

    opacity:0;

    animation:fader 25s infinite;


}



/* Placa eletrônica */

.bg-img:nth-child(1) {

    background-image:
    url("https://images.unsplash.com/photo-1518770660439-4636190af475?w=1600&q=80");

    animation-delay:0s;

}



/* Notebook */

.bg-img:nth-child(2) {

    background-image:
    url("https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=1600&q=80");

    animation-delay:5s;

}



/* Componentes PC */

.bg-img:nth-child(3) {

    background-image:
    url("https://images.unsplash.com/photo-1591488320449-011701bb6704?w=1600&q=80");

    animation-delay:10s;

}



/* Servidores */

.bg-img:nth-child(4) {

    background-image:
    url("https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1600&q=80");

    animation-delay:15s;

}



/* Computador / hardware */

.bg-img:nth-child(5) {

    background-image:
    url("https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=1600&q=80");

    animation-delay:20s;

}




@keyframes fader {


    0% {

        opacity:0;

    }


    15% {

        opacity:0.12;

    }


    35% {

        opacity:0.12;

    }


    45% {

        opacity:0;

    }


    100% {

        opacity:0;

    }


}



/* ===========================
       CARTÃO PRINCIPAL
   =========================== */


.container {


    position:relative;

    z-index:2;


    width:100%;

    max-width:450px;


    text-align:center;


    background:rgba(255,255,255,0.92);


    padding:35px 30px;


    border-radius:16px;


    box-shadow:

    0 8px 32px rgba(0,0,0,0.12);



}



/* LOGO */


.logo {


    max-width:340px;


    width:100%;


    height:auto;


    margin-bottom:20px;


}



/* STATUS */


.status-badge {


    display:inline-block;


    background:#f3f4f6;


    color:#4b5563;


    padding:6px 16px;


    border-radius:20px;


    font-size:14px;


    font-weight:600;


    text-transform:uppercase;


    letter-spacing:1px;


    margin-bottom:30px;


    border:1px solid #e5e7eb;



}



/* CONTATOS */


.contatos {


    border-top:1px solid #eaeaea;


    padding-top:25px;



}



.bloco-contato {


    margin-bottom:25px;


}



.bloco-contato span {


    display:block;


    font-size:12px;


    text-transform:uppercase;


    letter-spacing:1px;


    color:#7f8c8d;


    margin-bottom:5px;



}



.bloco-contato a {


    color:#0066cc;


    text-decoration:none;


    font-weight:600;


    font-size:18px;



}



.bloco-contato a:hover {


    text-decoration:underline;


}



</style>


</head>



<body>



<!-- Fundo -->


<div class="bg-slideshow">


<div class="bg-img"></div>

<div class="bg-img"></div>

<div class="bg-img"></div>

<div class="bg-img"></div>

<div class="bg-img"></div>


</div>

</body>

</html>
