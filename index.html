<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCH Soluções</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        /* --- FUNDO TECNOLÓGICO GERADO POR CÓDIGO (SEM LINKS) --- */
        body {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            
            /* Cria uma malha sutil que lembra circuitos e engenharia */
            background-color: #f4f7f6;
            background-image: 
                linear-gradient(90deg, rgba(0,102,204,0.03) 1px, transparent 1px),
                linear-gradient(rgba(0,102,204,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- CONTEÚDO PRINCIPAL (FRENTE) --- */
        .container {
            text-align: center;
            max-width: 450px;
            width: 100%;
            background-color: #ffffff;
            padding: 35px 30px;
            border-radius: 16px;
            /* Sombra suave para dar profundidade profissional */
            box-shadow: 0 10px 30px rgba(0, 102, 204, 0.08);
            border: 1px solid rgba(0, 102, 204, 0.1);
        }
        .logo {
            max-width: 340px; 
            width: 100%;
            height: auto;
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-block;
            background-color: #e6f0fa;
            color: #0066cc;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 102, 204, 0.2);
        }
        .contatos {
            border-top: 1px solid #eaeaea;
            padding-top: 25px;
        }
        .bloco-contato {
            margin-bottom: 25px;
            font-size: 16px;
        }
        .bloco-contato span {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            margin-bottom: 4px;
        }
        .bloco-contato a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
        }
        .bloco-contato a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Seu Logo -->
        <img src="logo.png" alt="PCH Soluções" class="logo">

        <!-- Tag de Status -->
        <div class="status-badge">Aviso: Em Construção</div>

        <!-- Informações de contato -->
        <div class="contatos">
            <div class="bloco-contato">
                <span>WhatsApp / Telefone</span>
                <!-- Texto limpo para você discar ou adicionar -->
                <a href="tel:1932914248">(19) 3291-4248</a>
            </div>
            
            <div class="bloco-contato">
                <span>E-mail Corporativo</span>
                <a href="mailto:contato@pchsolucoes.com.br">contato@pchsolucoes.com.br</a>
            </div>
        </div>
    </div>

</body>
</html>
