<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCH Soluções</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        /* Define um tamanho equilibrado para o logo */
        .logo {
            max-width: 340px; 
            width: 100%;
            height: auto;
            margin-bottom: 20px;
        }
        /* Alerta de em construção */
        .status-badge {
            display: inline-block;
            background-color: #f3f4f6;
            color: #4b5563;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            border: 1px solid #e5e7eb;
        }
        /* Linha divisória e bloco de contatos */
        .contatos {
            border-top: 1px solid #eaeaea;
            padding-top: 25px;
        }
        .bloco-contato {
            margin-bottom: 25px;
            font-size: 16px;
        }
        .bloco-contato span {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            margin-bottom: 4px;
        }
        .bloco-contato a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
        }
        .bloco-contato a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo centralizado e menor -->
        <img src="logo.png" alt="PCH Soluções" class="logo">

        <!-- Tag de Status -->
        <div class="status-badge">🚧 Em Construção</div>

        <!-- Informações de contato -->
        <div class="contatos">
            <div class="bloco-contato">
                <span>WhatsApp / Telefone</span>
                <a href="https://wa.me" target="_blank">(19) 3291-4248</a>
            </div>
            
            <div class="bloco-contato">
                <span>E-mail</span>
                <a href="mailto:contato@pchsolucoes.com.br">contato@pchsolucoes.com.br</a>
            </div>
        </div>
    </div>

</body>
</html>
