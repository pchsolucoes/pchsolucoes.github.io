<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCH Soluções</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        /* --- SISTEMA DE FOTOS DE HARDWARE NO FUNDO --- */
        .bg-slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0; 
            animation: fader 12s infinite linear;
        }
        
        /* Foto 1: Placa-mãe de PC em detalhes */
        .bg-img:nth-child(1) {
            background-image: url('https://unsplash.com');
            animation-delay: 0s;
        }
        /* Foto 2: Notebook aberto mostrando a tela e teclado */
        .bg-img:nth-child(2) {
            background-image: url('https://unsplash.com');
            animation-delay: 4s;
        }
        /* Foto 3: Circuito eletrônico/Hardware aproximado */
        .bg-img:nth-child(3) {
            background-image: url('https://unsplash.com');
            animation-delay: 8s;
        }

        /* Efeito de transição suave (Aparece e Some) */
        @keyframes fader {
            0% { opacity: 0; }
            15% { opacity: 0.05; } /* Opacidade em 5% para ficar bem sutil ao fundo */
            40% { opacity: 0.05; } 
            55% { opacity: 0; }    
            100% { opacity: 0; }
        }

        /* --- CONTEÚDO PRINCIPAL (FRENTE) --- */
        .container {
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 2; 
            background-color: rgba(255, 255, 255, 0.90); /* Fundo do bloco ligeiramente mais firme para garantir leitura */
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
        .logo {
            max-width: 340px; 
            width: 100%;
            height: auto;
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-block;
            background-color: #f3f4f6;
            color: #4b5563;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            border: 1px solid #e5e7eb;
        }
        .contatos {
            border-top: 1px solid #eaeaea;
            padding-top: 25px;
        }
        .bloco-contato {
            margin-bottom: 25px;
            font-size: 16px;
        }
        .bloco-contato span {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            margin-bottom: 4px;
        }
        .bloco-contato a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
        }
        .bloco-contato a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Carrossel de fotos de hardware ao fundo -->
    <div class="bg-slideshow">
        <div class="bg-img"></div>
        <div class="bg-img"></div>
        <div class="bg-img"></div>
    </div>

    <div class="container">
        <!-- Seu Logo -->
        <img src="logo.png" alt="PCH Soluções" class="logo">

        <!-- Tag de Status -->
        <div class="status-badge">🚧 Em Construção</div>

        <!-- Informações de contato -->
        <div class="contatos">
            <div class="bloco-contato">
                <span>WhatsApp / Telefone</span>
                <a href="https://wa.me" target="_blank">(19) 3291-4248</a>
            </div>
            
            <div class="bloco-contato">
                <span>E-mail</span>
                <a href="mailto:contato@pchsolucoes.com.br">contato@pchsolucoes.com.br</a>
            </div>
        </div>
    </div>

</body>
</html>
